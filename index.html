<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>登山赛车 - Hill Climb Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #228B22 60%, #228B22 100%);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 10;
            pointer-events: none;
        }
        
        #ui > div {
            margin: 5px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 5px;
        }
        
        #fuelBar {
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        #fuelFill {
            height: 100%;
            background: linear-gradient(to right, #ff4444, #ffcc00);
            transition: width 0.1s;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        
        #startScreen, #gameOverScreen, #pauseScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }
        
        #gameOverScreen, #pauseScreen {
            display: none;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffcc00;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
        }
        
        .btn {
            background: linear-gradient(to bottom, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .subtitle {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }
        
        .stats {
            font-size: 24px;
            margin: 10px 0;
        }
        
        #distanceValue, #coinValue, #speedValue {
            color: #ffcc00;
            font-weight: bold;
        }
        
        #scoreValue {
            color: #ff4444;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="700"></canvas>
        
        <div id="ui">
            <div>距离: <span id="distanceValue">0</span> 米</div>
            <div>金币: <span id="coinValue">0</span></div>
            <div>速度: <span id="speedValue">0</span> km/h</div>
            <div id="fuelBar">
                <div id="fuelFill" style="width: 100%;"></div>
            </div>
            <div style="font-size: 12px; margin-top: 5px;">油量</div>
        </div>
        
        <div id="controls">
            ⬆️/W - 加速 | ⬇️/S - 刹车 | 空格 - 暂停/继续
        </div>
        
        <div id="startScreen">
            <h1>🚗 登山赛车 🏔️</h1>
            <p class="subtitle">Hill Climb Racing - Web Edition</p>
            <div class="stats">
                <p>驾驶你的越野车征服崎岖山路！</p>
                <p>收集金币，保持油量，挑战最远距离！</p>
            </div>
            <button class="btn" id="startBtn">开始游戏</button>
            <p class="subtitle" style="margin-top: 20px; font-size: 14px;">
                操作: ⬆️/W 加速 | ⬇️/S 刹车 | 空格 暂停
            </p>
        </div>
        
        <div id="gameOverScreen">
            <h1>💥 游戏结束</h1>
            <div class="stats">
                <p>行驶距离: <span id="scoreValue">0</span> 米</p>
                <p>收集金币: <span id="finalCoinValue">0</span></p>
            </div>
            <button class="btn" id="restartBtn">重新开始</button>
        </div>
        
        <div id="pauseScreen">
            <h1>⏸️ 游戏暂停</h1>
            <p class="subtitle">按空格键继续</p>
            <button class="btn" id="resumeBtn">继续游戏</button>
            <button class="btn" id="restartBtn2" style="background: linear-gradient(to bottom, #ff4444, #cc0000);">重新开始</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
